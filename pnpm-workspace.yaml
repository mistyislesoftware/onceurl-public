packages:
  - "apps/*"
  - "packages/*"
overrides:
  # @esbuild-kit/core-utils@3.3.2 otherwise resolves vulnerable esbuild~0.18.20.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # Tooling's minimatch accepts this patch; 5.0.9 is affected by the newer
  # recursion advisories. Remove once parents resolve >=5.0.11 and gates pass.
  brace-expansion: 5.0.11
  # The latest Worker test pool still pins Miniflare to undici 7.29.0.
  # Remove once all Miniflare parents resolve >=7.29.1 and repository gates pass.
  "miniflare>undici": 7.29.1
  sharp: 0.35.4
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
